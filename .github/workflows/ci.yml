name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # webrtc-sys (via crates/media-livekit) compiles a C++ bridge and needs
      # clang >= 21 plus glib/gobject/gio development headers.
      - name: Install clang 21 and glib headers
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-21 libglib2.0-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CXX: clang++-21
      - run: cargo test --workspace
        env:
          CXX: clang++-21

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  rust-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test
          POSTGRES_DB: nordsvar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Postgres integration tests
        env:
          NORDSVAR_TEST_DATABASE_URL: postgres://postgres:ci-test@localhost:5432/nordsvar_test
        run: cargo test -p nordsvar-api --test postgres

  livekit-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang 21 and glib headers
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-21 libglib2.0-dev
      - name: Download livekit-server
        run: |
          curl -sLO https://github.com/livekit/livekit/releases/download/v1.13.6/livekit_1.13.6_linux_amd64.tar.gz
          tar -xzf livekit_1.13.6_linux_amd64.tar.gz
          echo "LIVEKIT_SERVER_BIN=$PWD/livekit-server" >> "$GITHUB_ENV"
      - name: Run live LiveKit room tests
        run: cargo test -p nordsvar-media-livekit --test livekit_e2e
        env:
          CXX: clang++-21
