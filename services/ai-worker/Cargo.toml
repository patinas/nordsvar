[package]
name = "nordsvar-ai-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
hound = "3.5"
jsonwebtoken = "9"
nordsvar-ai-core = { path = "../../crates/ai-core" }
nordsvar-kb-ingest = { path = "../../crates/kb-ingest" }
nordsvar-tenancy = { path = "../../crates/tenancy" }
nordsvar-media-livekit = { path = "../../crates/media-livekit" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
nordsvar-api = { path = "../api" }
tokio = { workspace = true, features = ["macros", "rt"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "nordsvar-ai-worker"
path = "src/main.rs"
