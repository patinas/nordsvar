[package]
name = "nordsvar-kb-ingest"
description = "Knowledge-base ingestion: parse, chunk, embed locally, and index into per-tenant vector storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
nordsvar-ai-core = { path = "../ai-core" }
nordsvar-tenancy = { path = "../tenancy" }
pdf-extract = "0.7"
quick-xml = "0.36"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
uuid = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["macros", "rt"] }
